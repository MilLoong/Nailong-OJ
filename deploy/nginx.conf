# NLOJ 反向代理示例：统一入口、提交限流。
# JWT 仍由 nloj_api 校验；nginx 只做入口与令牌桶式限流。
# 用法：nginx -c /path/to/NLOJ/deploy/nginx.conf（按本机改 root / prefix）

worker_processes 1;
events { worker_connections 1024; }

http {
    # 提交接口：平均 5 r/s，突发 20
    limit_req_zone $binary_remote_addr zone=nloj_submit:10m rate=5r/s;

    server {
        listen 80;
        server_name 127.0.0.1;

        location /api/v1/submissions {
            limit_req zone=nloj_submit burst=20 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }
    }
}
